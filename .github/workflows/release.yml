name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # main requires pull requests. The release app is the one actor allowed to
      # bypass that, so every write below (main, tag, release) uses its token,
      # not GITHUB_TOKEN. See docs/designs/20261104_release_workflow.md.
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate and publish release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
