name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate and publish release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
